# DS-11 answers — example with fake data (safe to share / commit)
# All names, addresses, SSNs, phone numbers, and dates are fictional.
# Fill in every value. Leave a field blank (empty string) if not applicable.

# ── APPLICANT (CHILD) ────────────────────────────────────────────────
applicant:
  last_name: Kowalski
  first_name: Jordan
  middle_name: Ellis
  full_name: "Kowalski, Jordan Ellis"    # Last, First Middle — repeated name field
  date_of_birth: 07/22/2020             # MM/DD/YYYY
  place_of_birth_city: Portland
  place_of_birth_state_or_country: Oregon   # full state name if US, country if abroad
  ssn: 513294867                        # 9 digits, no dashes; "None" if not yet issued
  sex: M                                # M / F / X
  hair_color: Brown                     # Black / Blonde / Brown / Gray / Red / Sandy / White / Bald / Unknown
  eye_color: Hazel                      # Black / Blue / Brown / Gray / Green / Hazel / Maroon / Pink / Unknown
  height_feet: 3
  height_inches: 2
  occupation: Student
  employer_or_school: Sunridge Montessori
  married: false

